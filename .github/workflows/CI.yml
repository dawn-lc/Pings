name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # 与平台无关的检查跑一次就够：编码、推导演算、构建、测试。
  # 全平台发布交给 build-matrix.yml，避免同一批用例在 12 个矩阵项里各跑一遍。
  verify:
    name: 编码 / 推导 / 测试
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify source encoding
        shell: pwsh
        run: |
          # 源码统一 UTF-8 无 BOM：中文注释/字符串在 BOM 缺失或混用编码时会变成乱码。
          # .resx 也要查：界面文案全在里面，编码坏了用户直接看到乱码。
          $files = Get-ChildItem -Recurse -File -Include *.cs, *.md, *.json, *.yml, *.csproj, *.resx |
            Where-Object { $_.FullName -notmatch '\\(bin|obj|\.git)\\' }

          foreach ($file in $files) {
            $bytes = [IO.File]::ReadAllBytes($file.FullName)
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              throw "文件含 UTF-8 BOM: $($file.FullName)"
            }
          }

          Write-Host "检查通过：$($files.Count) 个文件均为 UTF-8 无 BOM"

      - name: Verify RID to TFM derivation
        shell: pwsh
        run: |
          # 发布平台只靠 -r 表达，TFM 由 csproj 从 RID 推导。这是「一条命令发任意平台」的地基：
          # 推导一旦错，发布会在毫不相关的地方报 NETSDK1129，错误却只说「必须指定一个 TFM」。
          # 矩阵里每个 RID 都在这里先断言，等于在 12 个平台作业开跑前证明它们的输入是对的。
          $project = "src/Pings/Pings.csproj"

          $cases = @(
            @{ Rid = "";            TargetFramework = "";                TargetFrameworks = "net10.0;net10.0-windows" },
            @{ Rid = "win-x64";     TargetFramework = "net10.0-windows"; TargetFrameworks = "" },
            @{ Rid = "win-arm64";   TargetFramework = "net10.0-windows"; TargetFrameworks = "" },
            @{ Rid = "linux-x64";   TargetFramework = "net10.0";         TargetFrameworks = "" },
            @{ Rid = "linux-arm64"; TargetFramework = "net10.0";         TargetFrameworks = "" },
            @{ Rid = "osx-x64";     TargetFramework = "net10.0";         TargetFrameworks = "" },
            @{ Rid = "osx-arm64";   TargetFramework = "net10.0";         TargetFrameworks = "" }
          )

          $failed = @()
          foreach ($case in $cases) {
            $args = @("msbuild", $project, "-getProperty:TargetFramework", "-getProperty:TargetFrameworks", "-nologo")
            if ($case.Rid -ne "") { $args += "-p:RuntimeIdentifier=$($case.Rid)" }

            $props = (& dotnet @args | ConvertFrom-Json).Properties
            $rid = if ($case.Rid -eq "") { "（无 RID）" } else { $case.Rid }

            if ($props.TargetFramework -ne $case.TargetFramework -or $props.TargetFrameworks -ne $case.TargetFrameworks) {
              $failed += "$rid：期望 '$($case.TargetFramework)' / '$($case.TargetFrameworks)'，实际 '$($props.TargetFramework)' / '$($props.TargetFrameworks)'"
            }
          }

          if ($failed.Count -gt 0) { throw "RID → TFM 推导不符合预期：`n  " + ($failed -join "`n  ") }

          Write-Host "检查通过：$($cases.Count) 种 RID 均推导出预期 TFM"

      - name: Restore
        run: dotnet restore Pings.sln

      # 不带 -r：两个 TFM 都编译，一次覆盖「Windows 专用互操作代码」与「跨平台路径」两套编译条件——
      # 这正是本地开发默认看到的东西，CI 与本地不该是两种构建。
      - name: Build
        run: dotnet build Pings.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/Pings.Tests/Pings.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"

  # 全平台 × 全变体（net / aot），定义见 build-matrix.yml
  artifacts:
    name: 全平台发布
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/build-matrix.yml
