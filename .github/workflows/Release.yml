name: Release

# 版本号唯一真相源是 git tag：
#   v1.0.22 / 1.0.22            → 版本 1.0.22，类型 Release
#   v1.1.0-Beta / 1.1.0-Beta    → 版本 1.1.0，类型 Beta
#
#   git tag -a v1.0.22 -m "v1.0.22"
#   git push origin v1.0.22
#
# 只由 tag 触发、不给 workflow_dispatch 入口：手动入口只能跑默认分支的代码，
# 而「发出去的产物必须来自被打 tag 的那个提交」是这里唯一不能妥协的事。
# 失败后重跑同一次运行即可，ref 仍是原 tag。
on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    name: 解析版本
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.parse.outputs.version }}
      versionType: ${{ steps.parse.outputs.versionType }}

    steps:
      - name: Resolve version from tag
        id: parse
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { throw '无法确定发布 tag。' }

          # 剥掉 v 前缀，再按第一个 '-' 切成「版本」与「发布类型」
          $core = ($tag -replace '^[vV]', '')
          $parts = $core -split '-', 2
          $version = $parts[0]
          $versionType = if ($parts.Count -gt 1) { $parts[1] } else { 'Release' }

          # 必须是三段纯数字：段数不对时版本比较与展示都会失去意义，宁可在这里硬失败
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "tag '$tag' 的版本号 '$version' 不是三段 x.y.z"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "versionType=$versionType" >> $env:GITHUB_OUTPUT
          Write-Host "版本号: $version，类型: $versionType"

  test:
    name: 测试
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Pings.sln

      - name: Test
        run: dotnet test tests/Pings.Tests/Pings.Tests.csproj -c Release

  # 全平台 × 全变体，与 CI 共用同一份定义；这里只多传一个版本号。
  # 三份几乎相同的发布步骤（CI / Release / 各平台）一旦分开写，迟早互不一致。
  build:
    name: 全平台发布
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/build-matrix.yml
    with:
      appVersion: ${{ needs.version.outputs.version }}
      appVersionType: ${{ needs.version.outputs.versionType }}

  publish:
    name: 创建 Release
    needs: [version, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/assets
          merge-multiple: true

      - name: Verify asset set
        shell: pwsh
        run: |
          # 12 个产物（6 个 RID × 2 个变体）一个都不能少：少了就是某个矩阵项静默失败了。
          # 全部到齐才建 Release，避免发出「只含部分平台」的版本。
          $rids = @("win-x64", "win-arm64", "linux-x64", "linux-arm64", "osx-x64", "osx-arm64")
          $expected = foreach ($rid in $rids) {
            $ext = if ($rid.StartsWith("win")) { ".exe" } else { "" }
            "Pings-$rid-net$ext"
            "Pings-$rid-aot$ext"
          }

          $actual = Get-ChildItem "dist/assets" -File | Select-Object -ExpandProperty Name
          $missing = @($expected | Where-Object { $_ -notin $actual })
          $extra = @($actual | Where-Object { $_ -notin $expected })

          if ($missing.Count -gt 0) { throw "缺少发布产物：$($missing -join ', ')" }
          if ($extra.Count -gt 0) { throw "出现未预期的产物：$($extra -join ', ')" }

          Get-ChildItem "dist/assets" -File |
            Sort-Object Name |
            ForEach-Object { Write-Host ("{0}  {1:N2} MB" -f $_.Name, ($_.Length / 1MB)) }

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = "${{ needs.version.outputs.version }}"

          # 每个平台两个变体，共 12 个附件：文件名带 RID 与变体，下载的人不必猜。
          $assets = Get-ChildItem "dist/assets" -File | Select-Object -ExpandProperty FullName

          # 重跑时 Release 可能已经存在（上次上传中断、或人工改过说明），
          # 那就改成覆盖上传，而不是让整个作业因为「已存在」再失败一次。
          & gh release view $tag --repo "${{ github.repository }}" 2>&1 | Out-Null

          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag 已存在，改为覆盖上传附件"
            & gh release upload $tag @assets --clobber --repo "${{ github.repository }}"
          }
          else {
            Write-Host "创建 Release $tag"
            & gh release create $tag @assets --title $version --generate-notes --verify-tag --repo "${{ github.repository }}"
          }

          if ($LASTEXITCODE -ne 0) { throw "gh release 失败，退出码 $LASTEXITCODE" }
