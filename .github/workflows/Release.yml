name: Release

# 版本号唯一真相源是 git tag。tag 形如：
#   v1.0.22 / 1.0.22             → 版本 1.0.22，类型 Release
#   v1.1.0-Beta / 1.1.0-Beta      → 版本 1.1.0，类型 Beta
# 发布：git tag -a v1.0.22 -m "v1.0.22" && git push origin v1.0.22
on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的已有 tag（例如 v1.0.22）'
        required: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  UPX_VERSION: '5.3.0'

permissions:
  contents: write

jobs:
  release:
    name: 发布 Native AOT
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { throw '无法确定发布 tag。' }

          # 剥掉 v 前缀，再按第一个 '-' 切成「版本」与「发布类型」
          $core = ($tag -replace '^[vV]', '')
          $parts = $core -split '-', 2
          $version = $parts[0]
          $versionType = if ($parts.Count -gt 1) { $parts[1] } else { 'Release' }

          # 必须校验为三段纯数字：段数不对时版本比较/展示都会失去意义，宁可在这里硬失败
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "tag '$tag' 的版本号 '$version' 不是三段 x.y.z"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "versionType=$versionType" >> $env:GITHUB_OUTPUT
          Write-Host "版本号: $version，类型: $versionType"

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Pings.sln

      - name: Test
        run: dotnet test tests/Pings.Tests/Pings.Tests.csproj -c Release

      - name: Publish Native AOT
        run: >
          dotnet publish src/Pings/Pings.csproj -c Release
          -f net10.0-windows
          -p:PublishProfile=src/Pings/Properties/PublishProfiles/win-x64-aot.pubxml
          -p:AppVersion=${{ steps.version.outputs.version }}
          -p:AppVersionType=${{ steps.version.outputs.versionType }}
          -p:UpxVersion=${{ env.UPX_VERSION }}
          -o dist/aot

      - name: Verify published binary
        shell: pwsh
        run: |
          $exe = "dist/aot/Pings.exe"
          if (-not (Test-Path $exe)) { throw "发布产物不存在：$exe" }

          # 「发布目录只有一个文件」已由 csproj 的 VerifyPublishOutput 在构建期断言，
          # 这里验证只有产物自己能证明的事：真实 exe 读出的版本元数据。

          # 版本号与类型必须等于 tag 注入值（真实验证 AOT 产物里的程序集元数据读取）
          $version = "${{ steps.version.outputs.version }}"
          $versionType = "${{ steps.version.outputs.versionType }}"
          $expected = if ($versionType -eq 'Release') { "Pings $version" } else { "Pings $version-$versionType" }

          $actual = & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version 退出码 $LASTEXITCODE" }
          if ($actual -ne $expected) { throw "版本号不符: 期望 '$expected'，实际 '$actual'" }

          # UPX 是否真的压缩过：直接问 upx，而不是比体积阈值。
          # upx -l 对未压缩文件返回 2（NotPackedException）、对已压缩返回 0，是确定的事实；
          # 而体积阈值会随 .NET / ILCompiler 版本漂移。
          #
          # 注意：throw 文案里不要用中文引号 —— PowerShell 7 把它们当作字符串定界符，
          # 会直接把整个脚本解成语法错误（v1.0.22 发布就挂在这里）。
          $size = (Get-Item $exe).Length
          Write-Host ("产物：{0:N2} MB，版本 {1}" -f ($size / 1MB), $actual)

          $upx = "tools/upx/upx.exe"
          if (-not (Test-Path $upx)) { throw "找不到 $upx，无法验证 UPX 是否生效" }

          & $upx -l $exe
          if ($LASTEXITCODE -ne 0) {
            throw ("UPX 未生效：upx -l 退出码 {0}（未压缩产物），产物 {1:N2} MB" -f $LASTEXITCODE, ($size / 1MB))
          }

      - name: Smoke test (loopback)
        shell: pwsh
        run: |
          $config = @'
          {
            "tasks": [ { "name": "loopback", "protocol": "icmp", "target": "127.0.0.1", "timeout": 2000 } ],
            "logging": { "logFilePath": "smoke.log", "enableConsoleLog": false }
          }
          '@
          Set-Content -Path "smoke.json" -Value $config -Encoding utf8NoBOM

          & "dist/aot/Pings.exe" smoke.json --once --no-color
          if ($LASTEXITCODE -ne 0) { throw "--once 退出码 $LASTEXITCODE（回环地址应可达）" }

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"

          # 只发一个 exe：UPX 由构建期原地压缩，不再额外产出 upx-Pings.exe。
          # 两个 exe 会让使用者/自动化在两种形态间不确定地切换。
          gh release create $tag `
            "dist/aot/Pings.exe" `
            --title "${{ steps.version.outputs.version }}" `
            --generate-notes `
            --verify-tag
